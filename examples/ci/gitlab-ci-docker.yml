# GitLab CI: compare on every merge request, then assess the result, running
# the published example42/piace image instead of downloading the binary.
#
# Copy to .gitlab-ci.yml, or `include:` it, with the layout docs/ci.md
# describes:
#
#   ci/piace/targets.yaml            committed, reviewable policy
#   ci/piace/services.yaml.tmpl      committed, rendered per job
#   ci/piace/services-explain.yaml   committed, inference only
#   ci/piace/policy-notes.md         committed, site policy for the model
#   ci/piace/change-context.sh       committed, copied from PIACE's scripts/
#
# Two jobs, not one, because they need different credentials: `piace-compare`
# holds the catalog-reader identity and never sees the inference token,
# `piace-explain` holds the inference token and never sees a private key.
#
# This is the docker twin of gitlab-ci.yml, which installs the verified
# binary instead. `example42/piace` is distroless: no shell, and its
# entrypoint is the binary itself, so it cannot be the job's `image:` (the
# docker executor runs the job script by passing `sh` or `bash` to the
# image). It has to be invoked with `docker run`, and that needs a Docker
# daemon the job can reach: mount /var/run/docker.sock into the job, rather
# than the docker:dind service, whose daemon lives in its own container and
# cannot see the checkout's bind-mount paths below. With the socket mounted,
# the job container's filesystem is the host's, so `$PWD:/work` resolves to
# the checkout on the host. The official `docker` CLI image ships git and
# bash as well, so change-context.sh still runs on the runner. Pin a
# specific tag rather than `cli` in production.

variables:
  PIACE_VERSION: "0.2.1"
  # change-context.sh takes a merge base. GitLab clones shallow by default,
  # and a shallow clone does not have one.
  GIT_DEPTH: "0"
  # Outside the checkout: nothing here reaches `cache:`, `artifacts:`, or a
  # later `git status`. The docker and Kubernetes executors give each job a
  # fresh container, so this directory is private to the job. A shell or ssh
  # executor does not: there, every job on the host runs as the same user and
  # can read this path.
  PIACE_RUN: "/tmp/piace-run"

stages:
  - assess

piace-compare:
  stage: assess
  image: docker:27-cli
  rules:
    # Merge requests from a fork do not get protected variables, so the job
    # would fail at TLS load with exit 30 rather than doing anything useful.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH
  script:
    # PIACE_CA_BUNDLE, PIACE_CLIENT_CERT and PIACE_PRIVATE_KEY are **file
    # type** CI/CD variables: GitLab writes each value to a temporary file and
    # puts that file's path in the variable. Use file type rather than
    # variable type for all three. A PEM is multi-line, and a multi-line value
    # cannot be masked, so a variable-type key is one `echo` away from a job
    # log. Mark all three Protected as well, so an unprotected branch never
    # sees them.
    - install -d -m 0700 "$PIACE_RUN"
    - install -m 0600 "$PIACE_CA_BUNDLE"   "$PIACE_RUN/ca.pem"
    - install -m 0600 "$PIACE_CLIENT_CERT" "$PIACE_RUN/client.pem"
    - install -m 0600 "$PIACE_PRIVATE_KEY" "$PIACE_RUN/client.key"
    # PIACE expands nothing in a services file, and its TLS paths resolve
    # against the process working directory (which is /work inside the
    # container, where the checkout is mounted). The run directory is mounted
    # at /run/piace, so the placeholder is rendered to the container path,
    # not to a host path.
    - sed "s|@PIACE_RUN@|/run/piace|g" ci/piace/services.yaml.tmpl > "$PIACE_RUN/services.yaml"
    # The candidate environment is the one this pipeline deployed: a
    # per-pipeline value, passed at the invocation so the committed target
    # file stays reviewable policy and the job never rewrites it. It
    # overrides candidate.environment for every target, so the file may omit
    # the field entirely. The environment maps to the compiler by branch name:
    # the source branch of this merge request is the Puppet environment the
    # compiler has deployed, so use CI_MERGE_REQUEST_SOURCE_BRANCH_NAME, not
    # the merge request number. A branch name is not always a Puppet
    # environment name: environments cannot contain a dash, and r10k, when
    # configured to, deploys `feature-x` as `feature_x`. Rewrite dashes the
    # same way so the requested environment equals the one deployed; match
    # whatever mapping your deploy stage applies, not one invented here.
    # `--user` maps the job's uid so report writes land in the /work mount:
    # the image runs as a non-root user by default.
    - |
      candidate_environment="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME//-/_}"
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --volume "$PWD:/work" \
        --volume "$PIACE_RUN:/run/piace:ro" \
        "example42/piace:${PIACE_VERSION}" \
        compare --targets ci/piace/targets.yaml \
                --services /run/piace/services.yaml \
                --candidate-environment "$candidate_environment" \
                --json-out report.json \
                --html-out report.html
  after_script:
    # after_script runs even when the job fails, times out or is cancelled,
    # which is exactly when a private key is most likely to be left behind.
    - rm -rf "$PIACE_RUN"
  allow_failure:
    # 10 is a policy difference: `docker run` returns the container's exit
    # code, so the gate is reported as a warning and the assessment job still
    # runs and a reviewer sees the report. 20 (the candidate did not compile)
    # and 30 (the run did not complete) stay hard failures. Drop this block
    # to block the merge request on 10 as well.
    exit_codes: 10
  artifacts:
    when: always
    expire_in: 1 week
    # Both reports carry catalog values, redacted per targets.yaml but not
    # otherwise sanitized. `access:` keeps them away from roles that can see
    # the pipeline but have no business reading a catalog. The container
    # wrote them into /work, which is this checkout, so they are where the
    # job expects them.
    access: 'developer'
    paths:
      - report.json
      - report.html

piace-explain:
  stage: assess
  image: docker:27-cli
  needs:
    # piace-compare is `allow_failure: exit_codes: 10`, so a policy difference
    # counts as success for the DAG and this job still runs: that is the
    # pipeline most worth assessing, and `compare` writes report.json before
    # it exits 10. A hard failure (20 or 30) skips this job, which is right,
    # because there is no complete result document to assess.
    - job: piace-compare
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH
  script:
    # PIACE never invokes git. This script does, in the checkout, on the
    # runner: commit subjects and changed paths only, never bodies. Read
    # examples/change-context.yaml before enabling it. Everything in the
    # generated file is forwarded to the inference service as data, and the
    # change context is not pseudonymized. The docker image tag ships bash
    # and git, so this needs no apk.
    - ci/piace/change-context.sh "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD > change-context.yaml
    # The generator stops at commit subjects and changed paths: title and
    # description belong to the merge request, which git does not have. Without
    # this the model never learns what the change is for. A literal block
    # scalar because a description is multi-line and a title contains colons.
    # These are shell variables in the running job, not values substituted into
    # the script, so quoting them is enough.
    - |
      {
        printf '  title: |\n'
        printf '%s\n' "$CI_MERGE_REQUEST_TITLE"       | sed 's/^/    /'
        printf '  description: |\n'
        printf '%s\n' "$CI_MERGE_REQUEST_DESCRIPTION" | sed 's/^/    /'
      } >> change-context.yaml
    # PIACE_INFERENCE_TOKEN is a masked, protected variable of type variable:
    # a bearer token is single-line, so unlike a PEM it can be masked. The
    # services file references it by name; there is no field that inlines one.
    # `--env NAME` inherits it from the job environment into the container
    # without it ever appearing in a command line.
    - |
      docker run --rm \
        --env PIACE_INFERENCE_TOKEN \
        --user "$(id -u):$(id -g)" \
        --volume "$PWD:/work" \
        "example42/piace:${PIACE_VERSION}" \
        explain --json-in report.json \
                --services ci/piace/services-explain.yaml \
                --change change-context.yaml \
                --ai-out assessment.json \
                --html-out report.html
  artifacts:
    when: always
    expire_in: 1 week
    access: 'developer'
    paths:
      - assessment.json
      - report.html