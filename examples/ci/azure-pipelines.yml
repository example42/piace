# Azure Pipelines: compare on every pull request, then assess the result.
#
# Copy to azure-pipelines.yml in your control repository, with the layout
# docs/ci.md describes:
#
#   ci/piace/targets.yaml     committed, reviewable policy
#   ci/piace/services.yaml    committed, endpoints and credential references
#   ci/piace/policy-notes.md  committed, optional site policy for the model
#
# Three files, and none of them is rendered, copied or rewritten by a job.
# The services file names its TLS material through `*_env`, so the committed
# file is read in place: see examples/ci/services.yaml.
#
# Two jobs, not one, because they need different credentials: compare holds
# the catalog-reader identity and never sees the inference token, explain
# holds the inference token and never sees a private key. A runner compromise
# in either job yields one of the two. That separation lives in which secure
# files and variables each job is granted, not in which file it reads.
#
# Before this runs, provision in the DevOps UI:
#   * three Secure Files holding the catalog-reader PEMs. Azure has no
#     multi-line variable: a PEM cannot be masked, so the file type is the
#     only safe form, and DownloadSecureFile below is the built-in task,
#   * the PIACE_INFERENCE_TOKEN pipeline secret (single-line, maskable).
#
# `pool:` is a hosted Ubuntu image, not example42/piace: the published image
# is distroless, and these jobs need bash, git, curl, grep, jq and sha256sum.
# Install the verified binary into the hosted image instead.

trigger: none

pr:
  branches:
    include:
    - '*'

variables:
- name: PIACE_VERSION
  value: '0.3.0'

jobs:
- job: compare
  pool:
    vmImage: 'ubuntu-latest'
  # A pull request from a fork gets no secrets, so the job would fail at TLS
  # load with exit 30 rather than doing anything useful. Skip it instead:
  # the same-repo guard the other examples encode.
  condition: eq(variables['System.PullRequest.IsFork'], 'False')
  steps:
  - checkout: self

  # Pinned to a version and verified against the manifest published with it.
  # A runner that fetches "the latest binary" on every run is a supply chain
  # you do not control. Everything here ships with the hosted image; no
  # package installation.
  - bash: |
      set -euo pipefail
      mkdir -p "$BIN_DIR"
      base="https://github.com/example42/piace/releases/download/v${VERSION}"
      curl -fsSLO "$base/piace-${VERSION}-linux-amd64"
      curl -fsSLO "$base/SHA256SUMS"
      # One line of the manifest, not the whole file: the other platforms
      # were not downloaded, and a line matching nothing on disk has to fail
      # rather than pass quietly.
      grep " piace-${VERSION}-linux-amd64\$" SHA256SUMS | sha256sum -c -
      install -m 0755 "piace-${VERSION}-linux-amd64" "$BIN_DIR/piace"
    env:
      BIN_DIR: $(Agent.TempDirectory)/piace-bin
      VERSION: $(PIACE_VERSION)

  # Agent.TempDirectory is per-job and outside the checkout, which is what
  # makes it the right home for a private key: nothing here reaches an
  # uploaded artifact or a later `git status`.
  - task: DownloadSecureFile@1
    name: caBundle
    inputs:
      secureFile: piace-ca.pem
  - task: DownloadSecureFile@1
    name: clientCert
    inputs:
      secureFile: piace-client-cert.pem
  - task: DownloadSecureFile@1
    name: clientKey
    inputs:
      secureFile: piace-client-key.pem

  # No `set -x` in this step, ever. The keys themselves are never echoed; a
  # trace of the commands that write them would be.
  - bash: |
      set -euo pipefail
      umask 077
      install -d -m 0700 "$RUN_DIR"
      install -m 0600 "$CA_BUNDLE"   "$RUN_DIR/ca.pem"
      install -m 0600 "$CLIENT_CERT" "$RUN_DIR/client.pem"
      install -m 0600 "$CLIENT_KEY"  "$RUN_DIR/client.key"
      # ci/piace/services.yaml names these three variables with
      # ca_bundle_env, client_cert_env and private_key_env, so the committed
      # file is read in place: nothing renders or copies it.
      echo "##vso[task.setvariable variable=PIACE_CA_BUNDLE]$RUN_DIR/ca.pem"
      echo "##vso[task.setvariable variable=PIACE_CLIENT_CERT]$RUN_DIR/client.pem"
      echo "##vso[task.setvariable variable=PIACE_PRIVATE_KEY]$RUN_DIR/client.key"
      mkdir -p report
    env:
      RUN_DIR: $(Agent.TempDirectory)/piace-run
      CA_BUNDLE: $(caBundle.secureFilePath)
      CLIENT_CERT: $(clientCert.secureFilePath)
      CLIENT_KEY: $(clientKey.secureFilePath)

  # Exit 10 is a policy difference, which fails this step and so the job:
  # that is `fail_on_diff: true` in targets.yaml doing its work. 20 and 30
  # mean the run did not complete. To review differences without blocking,
  # set `continueOnError: true` on this task: the report still says what
  # changed, but 20 and 30 slip through too, which is worse than GitLab's
  # per-exit-code softening.
  #
  # The candidate environment is the one this pipeline deployed. It maps to
  # the compiler by branch name, so use the source branch of this pull
  # request, not the pull request number, and rewrite dashes to underscores:
  # a Puppet environment name cannot contain a dash, and r10k deploys an
  # environment that way. Match whatever mapping your deploy applies, not one
  # invented here.
  #
  # Every value reaches the script as an environment variable, never through
  # `$(...)` in the script text: the agent macro-expands task inputs before
  # the shell runs, so an untrusted value substituted into the text would
  # run. That is also why the scripts hold no shell `$( ... )` command
  # substitution: the agent treats the token as a variable. SOURCE_BRANCH is
  # refs/heads/feature-x; parameter expansion strips the prefix and maps the
  # dash.
  - bash: |
      set -euo pipefail
      export PATH="$BIN_DIR:$PATH"
      source_branch="${SOURCE_BRANCH#refs/heads/}"
      candidate_environment="${source_branch//-/_}"
      piace compare \
        --targets ci/piace/targets.yaml \
        --services ci/piace/services.yaml \
        --candidate-environment "$candidate_environment" \
        --json-out report/report.json \
        --html-out report/report.html
    env:
      BIN_DIR: $(Agent.TempDirectory)/piace-bin
      RUN_DIR: $(Agent.TempDirectory)/piace-run
      SOURCE_BRANCH: $(System.PullRequest.SourceBranch)

  # compare writes report.json before it exits 10 or 30, so always() keeps
  # the report from a gated run: that is the run most worth a human look.
  # Retention is set in the pipeline settings, not here: both reports carry
  # catalog values, redacted per targets.yaml but not otherwise sanitized, so
  # keep it short. A hosted agent tears down after the job and a self-hosted
  # one does not; the cleanup step costs nothing on the first and matters on
  # the second.
  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: report
      artifactName: piace-report
  - bash: rm -rf "$RUN_DIR"
    condition: always()
    env:
      RUN_DIR: $(Agent.TempDirectory)/piace-run

- job: explain
  dependsOn: compare
  # always(): the run worth assessing is usually the one that just failed the
  # gate, and compare writes report.json before it exits. The fork check
  # mirrors compare: a fork PR gets no secrets, and the guarded assess step
  # would only no-op on a tokenless job. When there is no report (a hard
  # failure at 30 usually leaves none) the guarded steps do nothing.
  condition: and(always(), eq(variables['System.PullRequest.IsFork'], 'False'))
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - download: none
  - checkout: self
    # `piace change-context` takes a merge base, which a shallow clone does
    # not have, and the PR checkout is a temporary merge commit whose target ref
    # is fetched explicitly below. The credentials must survive for that
    # later fetch.
    fetchDepth: 0
    persistCredentials: true

  - bash: |
      set -euo pipefail
      mkdir -p "$BIN_DIR"
      base="https://github.com/example42/piace/releases/download/v${VERSION}"
      curl -fsSLO "$base/piace-${VERSION}-linux-amd64"
      curl -fsSLO "$base/SHA256SUMS"
      grep " piace-${VERSION}-linux-amd64\$" SHA256SUMS | sha256sum -c -
      install -m 0755 "piace-${VERSION}-linux-amd64" "$BIN_DIR/piace"
    env:
      BIN_DIR: $(Agent.TempDirectory)/piace-bin
      VERSION: $(PIACE_VERSION)

  # continueOnError: a missing report means compare died before publishing,
  # and the guarded steps below then no-op rather than failing a job that can
  # only advise.
  - task: DownloadPipelineArtifact@2
    continueOnError: true
    inputs:
      buildType: current
      artifactName: piace-report
      targetPath: $(Agent.SourcesDirectory)/report

  # `change-context` is the one subcommand that runs git, and it is optional.
  # Commit subjects and changed paths only, never bodies. Read
  # examples/change-context.yaml before enabling it: everything in the
  # generated file is forwarded to the inference service as data, and the
  # change context is not pseudonymized.
  #
  # Azure exposes no pull request title or description variables (unlike
  # GitLab and GitHub), so they come from the pull request REST API, using
  # the OAuth token mapped from System.AccessToken. If that token is not
  # granted to the job, this step fails and the assessment is skipped, which
  # is an advisory outcome.
  #
  # Nothing untrusted is passed by value. The agent macro-expands `$( ... )`
  # in script text before a shell runs, so a pull request title reaching a
  # command line is a command; --title-file and --base-ref-env take a
  # location instead, and there is deliberately no --title flag.
  - bash: |
      set -euo pipefail
      test -f report/report.json || exit 0
      export PATH="$BIN_DIR:$PATH"
      export BASE_REF="origin/${TARGET_BRANCH#refs/heads/}"
      git fetch origin "+refs/heads/${TARGET_BRANCH#refs/heads/}:refs/remotes/${BASE_REF}"
      curl -fsS -o pull-request.json \
        -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        "${COLLECTION_URI}${PROJECT}/_apis/git/repositories/${REPOSITORY_ID}/pullrequests/${PR_ID}?api-version=6.0"
      jq -r '.title' pull-request.json > pr-title.txt
      jq -r '.description // ""' pull-request.json > pr-body.txt
      export HEAD_REF="${SOURCE_BRANCH#refs/heads/}"
      piace change-context \
        --base-ref-env BASE_REF \
        --head-ref-env HEAD_REF \
        --title-file pr-title.txt \
        --description-file pr-body.txt \
        > change-context.yaml
    env:
      BIN_DIR: $(Agent.TempDirectory)/piace-bin
      TARGET_BRANCH: $(System.PullRequest.TargetBranch)
      SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      COLLECTION_URI: $(System.TeamFoundationCollectionUri)
      PROJECT: $(System.TeamProject)
      REPOSITORY_ID: $(Build.Repository.ID)
      PR_ID: $(System.PullRequest.PullRequestId)

  # The token is referenced by name; there is no field that inlines one.
  # explain cannot change an exit code, so a failure here is advisory unless
  # you pass --fail-on-inference-error. The change context file exists only
  # when the describe step ran.
  - bash: |
      set -euo pipefail
      export PATH="$BIN_DIR:$PATH"
      test -f report/report.json || exit 0
      mkdir -p assessment
      piace explain \
        --json-in report/report.json \
        --services ci/piace/services.yaml \
        --change change-context.yaml \
        --ai-out assessment/assessment.json \
        --html-out assessment/report.html
    env:
      BIN_DIR: $(Agent.TempDirectory)/piace-bin
      PIACE_INFERENCE_TOKEN: $(PIACE_INFERENCE_TOKEN)

  # continueOnError: when compare left no report there is no assessment to
  # publish, and an absent directory must not turn an advisory job red.
  - task: PublishPipelineArtifact@1
    condition: always()
    continueOnError: true
    inputs:
      targetPath: assessment
      artifactName: piace-assessment