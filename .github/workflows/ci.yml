name: CI

# Pull requests run the test job. A merge to main runs the same test job
# and then, only if it passed, builds the release artifacts and uploads
# them. A `v*` tag runs both, publishes a signed and attested GitHub
# Release from the artifacts the build job already verified, and then
# pushes the container image built from those same artifacts to Docker
# Hub and GHCR.
#
# All four live in one workflow so `needs:` can gate each stage on the
# one before it — a cross-workflow dependency would need `workflow_run`,
# which reports its status against the wrong commit and is easy to
# misread. That gating is the point on a tag: a release is published only
# from a commit whose tests passed on every matrix leg.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Least privilege by default. Only the release job writes to the
# repository, and it raises its own permission locally rather than
# granting it to every job here.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run. Only pull
# requests are cancelled: a merged commit keeps its artifacts, and
# cancelling a tag run would leave a published tag with no release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        include:
          # The minimum go.mod declares: the version the project actually
          # promises to build under.
          - os: ubuntu-latest
            go: '1.22'
          # The current release, to catch toolchain changes before they
          # become a forced upgrade.
          - os: ubuntu-latest
            go: 'stable'
          # PIACE writes snapshots with atomic rename, fsync, and 0600
          # permissions, and its release script branches on
          # sha256sum/shasum. Those are the parts most likely to diverge
          # between Linux and macOS, so macOS is not optional here.
          - os: macos-latest
            go: 'stable'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # setup-go caches the module and build caches keyed on go.sum.
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race because the acceptance suite runs in-process mTLS services
      # whose handlers execute on the net/http server's goroutines while
      # the pipeline reads their recorded state. -count=1 defeats the test
      # cache, which would otherwise let a green run say nothing.
      - name: go test -race
        run: go test -race -count=1 ./...

  build:
    name: build release artifacts
    needs: test
    runs-on: ubuntu-latest
    # Consumed by the release job, so it publishes the version this job
    # actually stamped rather than re-deriving it from the ref and
    # risking a disagreement between the two.
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # A tag builds the version it names; anything else builds a
      # commit-stamped development version that can never be mistaken for
      # a release. docs/release.md's artifact names carry no `v`, so the
      # prefix is stripped here rather than taught to the build script,
      # which stays a plain `VERSION` interface usable by hand.
      - name: Resolve the version to stamp
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            # A malformed tag has to fail here. Downstream it becomes an
            # artifact filename and the -X main.toolVersion stamp, where
            # `piace-1.0-linux-amd64` would be published looking every bit
            # as deliberate as a correct one.
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
              exit 1
            fi
            case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          else
            version="main-${GITHUB_SHA::7}"
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "building version $version"

      # Every artifact is CGO-free (requirements.md 12.1), so one Linux
      # runner cross-compiles the whole supported matrix. Running this on
      # pull requests too means a broken release script is found in review
      # rather than at release time.
      - name: Build artifacts and checksum manifest
        run: bash scripts/build-release.sh "${{ steps.version.outputs.version }}"

      # docs/release.md tells a consumer to verify the manifest before
      # installing. Running that same check here proves the manifest CI
      # produced is one that verification actually accepts.
      - name: Verify the checksum manifest
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      # Confirms the artifacts are the statically linked binaries
      # design.md section 11 describes, not something dynamically linked
      # against the runner's libc.
      - name: Confirm the Linux artifacts are statically linked
        working-directory: dist
        run: |
          for binary in piace-*-linux-*; do
            file "$binary"
            file "$binary" | grep -q 'statically linked' \
              || { echo "::error::$binary is not statically linked"; exit 1; }
          done

      # Ties the artifact back to the tag. -X main.toolVersion is what
      # `piace version` prints and what every result document records as
      # its invocation metadata, so a mis-stamped binary would misreport
      # itself in every report it ever produced — and the checksum
      # manifest would happily certify it.
      - name: Confirm the binary reports the version it was stamped with
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          reported="$(./dist/piace-${VERSION}-linux-amd64 version)"
          echo "$reported"
          if [ "$reported" != "piace ${VERSION}" ]; then
            echo "::error::binary reports '$reported', expected 'piace ${VERSION}'"
            exit 1
          fi

      # Uploaded for pushes only: a pull request has already had the build
      # validated above, and does not need artifacts accumulating against
      # the repository's storage. On a tag this is also the handoff to the
      # release job, which publishes these exact bytes rather than
      # building its own.
      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: piace-${{ steps.version.outputs.version }}
          path: |
            dist/piace-*
            dist/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    # github.ref_type is 'tag' only under the tags: ['v*'] trigger above,
    # so a push to main builds and uploads as before and stops there.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The only job in this workflow that writes to the repository, and the
    # only one holding the permission to. Granting it at the workflow
    # level would hand it to the test job as well, which runs the code
    # under review.
    #
    # id-token and attestations are what let this job sign and attest
    # without a key. Both are scoped to this job for the same reason
    # contents: write is: the test job runs the code under review, and it
    # must not be able to mint a signature that carries this repository's
    # identity.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The published bytes are the ones the build job already checked:
      # manifest verified, static linking confirmed, version stamp
      # asserted. Rebuilding here would publish artifacts that nothing had
      # checked, and a compiler or toolchain difference between the two
      # jobs would be invisible.
      - name: Download the verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: piace-${{ needs.build.outputs.version }}
          path: dist

      # Re-verified after the round trip through artifact upload and
      # download, so a truncated or corrupted transfer fails here rather
      # than reaching a consumer who trusts the manifest.
      - name: Re-verify the checksum manifest
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      # Provenance for the binaries themselves: which workflow, at which
      # commit, produced these exact bytes. It answers a different
      # question from the signature below, which is about the manifest,
      # and GitHub stores it rather than this repository.
      - name: Attest the release binaries
        uses: actions/attest@v4
        with:
          subject-path: dist/piace-*

      - uses: sigstore/cosign-installer@v3

      # Keyless: the certificate is issued against this workflow's own
      # OIDC identity and is valid for minutes, so there is no signing key
      # to store, rotate, or lose. That is the whole reason the signature
      # can be produced here, at publication time, rather than by a human
      # with a laptop some hours later.
      #
      # A checksum manifest published beside its own artifacts attests to
      # integrity and never to origin: anyone who could replace the
      # binaries could replace SHA256SUMS with them. This is what closes
      # that gap.
      - name: Sign the checksum manifest
        working-directory: dist
        run: cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json --yes

      # The notes state plainly what this release does and does not prove.
      # A checksum manifest published beside its own artifacts attests to
      # integrity, never to origin: anyone who could replace the binaries
      # could replace SHA256SUMS with them. Only the detached signature
      # closes that gap, and this workflow holds no signing key, so the
      # release says so instead of leaving a consumer to follow a
      # verification step that cannot yet succeed.
      - name: Compose the release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Statically linked, CGO-free binaries for linux/amd64, linux/arm64,"
            echo "darwin/amd64 and darwin/arm64."
            echo
            echo "## Verifying this download"
            echo
            echo "Verify the signature first. The checksum manifest shows only that a"
            echo "download is intact; the signature over it is what says where it came"
            echo "from, and it is produced by the publishing workflow itself, so it is"
            echo "attached from the moment this release exists."
            echo
            echo '```sh'
            echo "cosign verify-blob SHA256SUMS \\"
            echo "  --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity 'https://github.com/${REPO}/.github/workflows/ci.yml@refs/tags/${TAG}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum --check --ignore-missing SHA256SUMS   # shasum -a 256 on macOS"
            echo "./piace-${VERSION}-<os>-<arch> version"
            echo '```'
            echo
            echo "The binaries also carry a GitHub build provenance attestation naming the"
            echo "workflow and commit that produced them:"
            echo
            echo '```sh'
            echo "gh attestation verify piace-${VERSION}-linux-amd64 --repo ${REPO}"
            echo '```'
            echo
            echo "\`SHA256SUMS.asc\`, a detached OpenPGP signature over the same manifest,"
            echo "is attached separately for sites that require one. It is an extra, not the"
            echo "verification path: see \`docs/release.md\`."
            echo
            echo "## SHA256SUMS"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > release-notes.md
          cat release-notes.md

      # gh resolves the repository from GH_REPO, so this job needs no
      # checkout: the only inputs are the downloaded artifacts and the
      # notes composed above. The tag already exists — pushing it is what
      # triggered the run — so gh attaches the release to it rather than
      # creating one.
      #
      # Re-running this job after a release already exists fails, and is
      # meant to. The alternative — falling back to `gh release upload
      # --clobber` — would quietly overwrite the assets of a release
      # people may already have downloaded, to rescue a case (a partial
      # publish) that is rarer than the case it endangers. Delete the
      # incomplete release and re-run if that happens.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "piace $VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            dist/piace-* dist/SHA256SUMS dist/SHA256SUMS.sigstore.json

  image:
    name: publish container image
    # Both: `build` for the verified artifacts the image is assembled
    # from, `release` so Docker Hub follows the GitHub Release rather than
    # racing it. The GitHub Release stays the primary artifact: if the
    # push here fails, a release is already published and re-running this
    # job alone finishes the job.
    needs: [build, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # packages: write pushes to GHCR with the workflow's own token, so
    # that registry needs no stored credential at all. id-token and
    # attestations are the same keyless pair the release job uses.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # Only the Dockerfile and .dockerignore are needed here; the
      # binaries come from the build job, downloaded next.
      - uses: actions/checkout@v4

      - name: Download the verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: piace-${{ needs.build.outputs.version }}
          path: dist

      - name: Re-verify the checksum manifest
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      # Nothing runs in the target architecture during the build (every
      # image layer is a COPY of an already cross-compiled binary), so
      # buildx alone covers linux/arm64 and no QEMU setup is needed.
      - uses: docker/setup-buildx-action@v3

      - uses: sigstore/cosign-installer@v3

      # DOCKERHUB_TOKEN is a Docker Hub access token scoped to
      # read/write, not the account password. See docs/release.md.
      #
      # Before the first build, not just before the push: the Dockerfile's
      # `# syntax=` line makes BuildKit pull its frontend image from
      # Docker Hub, and an anonymous pull from a shared GitHub runner IP
      # is the kind of thing that hits a rate limit and fails a release
      # for reasons that have nothing to do with this repository.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image is published to both registries from one build. Docker
      # Hub stays the name the documentation uses, but an anonymous pull
      # from a shared CI runner IP is exactly what Docker Hub rate-limits,
      # and a pipeline that fails for that reason fails for a reason that
      # has nothing to do with this project. GHCR gives those runners a
      # mirror that costs this workflow one login with a token it already
      # holds.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and loaded locally first, so the assertion below runs
      # against the image that is about to be pushed rather than after the
      # fact. The multi-platform build that follows reuses this build's
      # cache, so the amd64 half of it is near-free.
      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: VERSION=${{ needs.build.outputs.version }}
          tags: piace:verify
          provenance: false

      # The same assertion the build job makes about the bare binary, made
      # again about the packaged one: it catches a COPY that picked up the
      # wrong artifact, and an image whose binary lost its executable bit
      # in transit through actions/upload-artifact.
      - name: Confirm the image reports the version it was built from
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          reported="$(docker run --rm piace:verify version)"
          echo "$reported"
          if [ "$reported" != "piace ${VERSION}" ]; then
            echo "::error::image reports '$reported', expected 'piace ${VERSION}'"
            exit 1
          fi

      # `latest` moves only for a full release. A prerelease that took it
      # would hand every `docker run example42/piace` a version nobody
      # asked for. Composed here rather than inline in `tags:` so an empty
      # line never reaches the action.
      - name: Compose the image tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          {
            echo 'tags<<TAGS'
            echo "example42/piace:${VERSION}"
            echo "ghcr.io/example42/piace:${VERSION}"
            if [ "$PRERELEASE" = "false" ]; then
              echo "example42/piace:latest"
              echo "ghcr.io/example42/piace:latest"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      # provenance: false keeps the pushed manifest list to the two
      # platforms it actually carries. BuildKit's own provenance would
      # ride along as a third manifest entry, which Docker Hub renders as
      # an `unknown/unknown` architecture beside the real ones. Nothing is
      # given up by turning it off: the attestation step below produces a
      # real one, stored beside the image rather than inside its manifest
      # list.
      - name: Build and push the multi-platform image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.build.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      # By digest, never by tag: a tag is a moving name and signing one
      # would say nothing about which bytes were signed. Both registries
      # carry the same manifest, so this is one digest signed twice, once
      # where each set of pullers will look for it.
      - name: Sign the pushed image
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for repo in example42/piace ghcr.io/example42/piace; do
            cosign sign --yes "${repo}@${DIGEST}"
          done

      - name: Attest the pushed image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/example42/piace
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
